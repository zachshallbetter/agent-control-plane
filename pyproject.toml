[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Provider-neutral admission, evidence, and qualification controls for autonomous software delivery"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
acp = "acp:main"

[tool.setuptools]
py-modules = [
  "acp",
  "admission",
  "bridge",
  "controller",
  "coordinator",
  "delivery",
  "ledger",
  "operating_mode",
  "policy",
  "project_gateway",
  "queue",
  "retry",
  "webhook_receiver",
  "worker",
  "worker_exec",
]
packages = ["adapters", "providers"]
